[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaqg"
version = "0.2.0"
description = "Knowledge Augmented Question Generation (KAQG) pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "KAQG Authors" }]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "neo4j>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
kaqg = "kaqg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a live Neo4j instance",
    "network: tests that call external services (OpenRouter)",
]
filterwarnings = [
    "ignore::DeprecationWarning:neo4j.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["kaqg"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true