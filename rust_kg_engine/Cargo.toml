[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ingest",
    "crates/pagerank",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["KAQG Authors"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neo4rs = "0.7"
pdf-extract = "0.7"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"