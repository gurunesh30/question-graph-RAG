[package]
name = "rust_kg_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neo4rs = "0.7"
pdf-extract = "0.7" # <--- ADD THIS FOR PDF EXTRACTION

[[bin]]
name = "rust_kg_engine"
path = "src/main.rs"

[[bin]]
name = "pagerank"
path = "src/bin/pagerank.rs"